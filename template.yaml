AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
# CloudFormation caps the top-level Description at 1024 characters
# (cfn-lint E1003), so the full account of *why* this template is
# shaped the way it is lives in comments below and in
# docs/runbook.md / the linked plans, not here.
Description: >
  project-orchestrator-service: one Lambda function behind an HTTP
  API, serving MCP over streamable HTTP — `service_identity`,
  `plan_read`, and the advisory-lease write path (chunk 1). Node
  P2-N015 (chunk 2) adds alias-aware lease-table selection: one
  published version answers two Lambda aliases, `live` (production,
  bound to the HTTP API) and `preprod` (its own Function URL) — see
  LiveAlias, PreprodAlias, and src/planRegister/aliasLeaseTable.ts
  below for how. See docs/runbook.md for the deploy procedure and
  https://github.com/majodali/project-orchestrator/blob/main/docs/plans/p2-n012-deploy-from-ci-on-merge.md
  for why.

Parameters:
  Stage:
    Type: String
    Default: prod
    Description: >
      A label for this deployment (e.g. `prod`, or a scratch value for
      testing the runbook itself) — NOT the API Gateway stage name.
      The HTTP API's actual stage is fixed to the reserved name
      `$default` (see the HttpApi resource below) so the invoke URL
      carries no stage segment and `rawPath` is `/health` / `/mcp`,
      identical to what `src/httpApp.ts` routes locally. A named stage
      puts that name in `rawPath` (e.g. `/prod/health`), which Hono
      never matches — the defect this rework (node P2-N008) fixes; see
      docs/runbook.md's "Why the endpoint has no stage segment" note.
      `Stage` is still applied as a resource tag below, so deployments
      can be told apart in CloudWatch/Cost Explorer without needing
      distinct API stages.
    AllowedPattern: "^[a-zA-Z0-9]+$"

  AuthTokenSecretName:
    Type: String
    Description: >
      Name (not ARN) of the AWS Secrets Manager secret whose
      SecretString is the bearer token clients present in the
      `Authorization: Bearer <token>` header (decision 5 of the
      p2-n002 plan). The owner creates this secret out of band (O4)
      before deploying — see docs/runbook.md step 4. Resolved into the
      Lambda's environment via a CloudFormation dynamic reference at
      deploy time, so the token is never a literal in this template,
      in a parameter-overrides file, or in git.

  ProjectName:
    Type: String
    Default: majodali/project-orchestrator
    Description: >
      The coordinating repository this deployment answers
      `service_identity` for. Chunk 1 child B does no git reads of its
      own (that starts at child C) — this is metadata only.

  ServiceCommit:
    Type: String
    Default: unknown
    Description: >
      The git commit of project-orchestrator-service this build was
      deployed from. Set by scripts/deploy.sh from `git rev-parse
      HEAD` — see docs/runbook.md. Used only to answer
      `service_identity`; never used for authorization.

  GithubAppId:
    Type: String
    Description: >
      The numeric ID of the GitHub App `plan_read` reads through
      (owner action O3, decision 6 of the p2-n002 plan — an
      installation with `contents: read`, never a personal access
      token). Not secret — visible on the App's own settings page.
      Set by scripts/deploy.sh from the GITHUB_APP_ID environment
      variable; see docs/runbook.md.

  GithubAppInstallationId:
    Type: String
    Description: >
      The App's installation ID for majodali/project-orchestrator
      (owner action O3) — visible in the installation settings URL.
      Not secret. Set by scripts/deploy.sh from
      GITHUB_APP_INSTALLATION_ID; see docs/runbook.md.

  GithubAppPrivateKeySecretName:
    Type: String
    Description: >
      Name (not ARN) of the AWS Secrets Manager secret whose
      SecretString is the GitHub App's PEM private key (owner action
      O3). The owner creates this secret out of band before
      deploying, the same pattern as AuthTokenSecretName above —
      resolved into the Lambda's environment via a CloudFormation
      dynamic reference at deploy time, so the key is never a literal
      in this template, in a parameter-overrides file, or in git.

  # LiveVersion is the promotion mechanism's parameter, node P2-N015
  # (I4) — the mechanism docs/findings/alias-assumptions.md
  # (assumption 5) prescribes verbatim for pinning `live` across stack
  # updates. Authoritative source of truth: the AWS alias's own,
  # actual `FunctionVersion` — this parameter exists only so an
  # ordinary deploy does not fight it, never the other way around.
  # `scripts/deploy.sh` reads that real value back via
  # `aws lambda get-alias --name live` before every `sam deploy` and
  # passes it back as this override, so an ordinary stack update
  # declares no change and CloudFormation leaves LiveAlias alone.
  # Promotion itself is a direct `aws lambda update-alias --name live`
  # call (child D, node P2-N016), outside CloudFormation — the next
  # ordinary deploy reads that new value back in. Defaults to
  # `$LATEST` (a valid FunctionVersion value) only for a stack that
  # has never had a version promoted to `live` yet — exactly what
  # production already serves before this node ships, so the default
  # changes nothing for a first deploy.
  LiveVersion:
    Type: String
    Default: "$LATEST"
    AllowedPattern: '(\$LATEST|[0-9]+)'
    Description: >
      The Lambda version promoted to `live` (node P2-N015, I4). Read
      back and passed through unchanged by scripts/deploy.sh on every
      ordinary deploy; promoted only by a direct
      `aws lambda update-alias` call, never a stack update. See the
      comment above this parameter for the full mechanism.

  # PreprodVersion (node P2-N015): unlike LiveVersion above, this needs
  # no read-back protection — `preprod` is *supposed* to move on every
  # deploy. A new version is published and `preprod` repointed at it
  # as part of child D's deploy-and-smoke-test sequence
  # (`aws lambda publish-version` + `aws lambda update-alias --name
  # preprod`, outside CloudFormation — the same reason neither alias
  # uses SAM's `AutoPublishAlias`, see LiveAlias's own comment).
  PreprodVersion:
    Type: String
    Default: "$LATEST"
    AllowedPattern: '(\$LATEST|[0-9]+)'
    Description: >
      The Lambda version `preprod` currently points at (node P2-N015).
      Repointed directly by child D's deploy-and-smoke sequence on
      every deploy; needs no read-back protection. See the comment
      above this parameter for why.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    MemorySize: 256
    # `service_identity` (chunk 1 child B) answers well inside 10s
    # alone. `plan_read` (chunk 1 child C, node P2-N009) adds up to
    # four sequential GitHub API round trips (mint/reuse an
    # installation token, resolve the default branch when no ref is
    # given, resolve the ref to a commit SHA, fetch file content) —
    # still small individually, but a wider backstop than the
    # reachability slice needed. 20s leaves comfortable headroom
    # below the enlistment file's 30s per-server timeout (G7) while
    # still failing well before a caller's own timeout does. Not yet
    # measured against a real deployment (owner action O3 is
    # outstanding); revisit this value once docs/runbook.md records
    # plan_read's actual cold/warm latency.
    Timeout: 20

Resources:
  McpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      # esbuild bundles the TypeScript entry point directly; no
      # separate `npm run build` step is needed before `sam build`
      # (see docs/runbook.md and scripts/deploy.sh).
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - src/lambda.ts
        Format: esm
        # hono/aws-lambda and @modelcontextprotocol/sdk both ship as
        # ESM; the Lambda Node.js 22 runtime resolves .mjs handlers
        # natively, so no extra loader config is required here.
        OutExtension:
          - .js=.mjs
        # Node P2-N010 rework (post-deploy 500 on every route,
        # including /health): @aws-sdk/client-dynamodb pulls in
        # @smithy/node-http-handler, which is CommonJS and
        # require()s Node builtins (e.g. "node:https"). Under
        # --format=esm there is no `require`, so esbuild's own
        # dynamic-require shim throws at import time and the Lambda
        # function never initializes — API Gateway's own 500, not the
        # app's. This banner defines a real `require` via node:module's
        # createRequire before any bundled code runs, the standard
        # remedy for CJS-dependency interop in an ESM esbuild bundle;
        # ESM output and hono/aws-lambda's `.mjs` handler resolution
        # are unaffected. See package.json's `bundle:lambda` script for
        # the identical banner applied there (kept in sync — both are
        # "the same bundle `sam build` produces", per README.md), and
        # test/lambdaBundle.test.ts for the regression test that
        # imports the built bundle from a real ESM context, the way
        # `node -e` (CommonJS mode) never would have caught this.
        Banner:
          - "js=import { createRequire as __createRequire } from 'node:module'; const require = __createRequire(import.meta.url);"
    Properties:
      Handler: src/lambda.handler
      Description: >
        project-orchestrator-service MCP endpoint (reachability
        slice, node P2-N008).
      Environment:
        Variables:
          MCP_PROJECT: !Ref ProjectName
          SERVICE_COMMIT: !Ref ServiceCommit
          # Resolved by CloudFormation at deploy time from Secrets
          # Manager — never a literal in this template or in any
          # parameter-overrides file committed to git (I7).
          MCP_AUTH_TOKEN: !Sub "{{resolve:secretsmanager:${AuthTokenSecretName}:SecretString}}"
          # plan_read (chunk 1 child C, node P2-N009) — GitHub App
          # credentials, owner action O3. GithubAppId and
          # GithubAppInstallationId are not secret; the private key is
          # resolved the same way MCP_AUTH_TOKEN is above.
          GITHUB_APP_ID: !Ref GithubAppId
          GITHUB_APP_INSTALLATION_ID: !Ref GithubAppInstallationId
          GITHUB_APP_PRIVATE_KEY: !Sub "{{resolve:secretsmanager:${GithubAppPrivateKeySecretName}:SecretString}}"
          # The write path (chunk 1 child D, node P2-N010) — the
          # advisory write lease's only storage when invoked
          # unqualified (local dev, tests) or via the `live` alias
          # (node P2-N015 — see src/planRegister/aliasLeaseTable.ts).
          # Never register content, only the lease; see LeaseTable
          # below.
          LEASE_TABLE_NAME: !Ref LeaseTable
          # node P2-N015: the `preprod` alias's own lease table — see
          # PreprodLeaseTable below. Read only through the qualifier
          # read (src/planRegister/aliasLeaseTable.ts); never touched
          # when this process has no invoked qualifier at all (I7).
          PREPROD_LEASE_TABLE_NAME: !Ref PreprodLeaseTable
      Policies:
        # Scoped exactly to LeaseTable and PreprodLeaseTable — no other
        # DynamoDB table this function's role can touch.
        # src/planRegister/dynamoLeaseBackend.ts only ever calls
        # GetItem/PutItem/DeleteItem, all of which this SAM policy
        # template covers. One function, one execution role, serving
        # both aliases (environment variables are per-version, not
        # per-alias — docs/findings/alias-assumptions.md, assumption
        # 1) — so the role needs both tables' worth of access; the
        # qualifier read at request time (I3) is what keeps a `preprod`
        # invocation from ever touching LeaseTable and vice versa, not
        # a narrower IAM grant (IAM here cannot see which alias
        # invoked it).
        - DynamoDBCrudPolicy:
            TableName: !Ref LeaseTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PreprodLeaseTable
      # No Events: here (node P2-N015) — SAM's `HttpApi` event-source
      # sugar always binds to the function's own unqualified ARN
      # ($LATEST), which is exactly the untested-code-served-on-every-
      # deploy failure mode "deploy, then promote" exists to prevent
      # (p2-n012 plan, "The preprod alias and the version that serves
      # it"). The production integration is bound explicitly to
      # LiveAlias below (McpIntegration / McpRoute / HealthRoute /
      # LiveInvokePermission) instead.
      Tags:
        Stage: !Ref Stage

  LeaseTable:
    Type: AWS::DynamoDB::Table
    Properties:
      # Chunk 1 scope (plan decision 4): plan state for this
      # repository only — a single fixed lease item
      # (src/planRegister/leaseBackend.ts's LEASE_KEY), never one
      # table per project or per node. Contention under multiple live
      # sessions is deferred to chunk 4 (decision 7); this table's
      # shape does not need to anticipate it.
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        # Best-effort cleanup only — AWS documents native TTL deletion
        # as running within (not guaranteed under) about 48 hours of
        # expiry. The authoritative expiry check is application-level,
        # in src/planRegister/dynamoLeaseBackend.ts's acquireLease
        # ConditionExpression (expiresAt < :now), not this attribute.
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Stage
          Value: !Ref Stage

  PreprodLeaseTable:
    Type: AWS::DynamoDB::Table
    Properties:
      # node P2-N015 — the `preprod` alias's own lease table, the same
      # shape as LeaseTable above (matching key schema, deliberately:
      # both are the same DynamoLeaseBackend code, just pointed at
      # different tables by the qualifier read). Permanent, not
      # created per run — the same "one fixed lease item, not one
      # table per project or per node" scope decision LeaseTable's own
      # comment states, and the same reason: contention handling is
      # chunk 4, not this node's to anticipate.
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Stage
          Value: !Ref Stage

  LiveAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref McpFunction
      Name: live
      FunctionVersion: !Ref LiveVersion
    # Deliberately a plain AWS::Lambda::Alias, not SAM's
    # AutoPublishAlias sugar (node P2-N015, I4 — this is child A's
    # riskiest finding made concrete). AutoPublishAlias publishes a new
    # version and repoints its alias to it on *every* code-changing
    # deploy (AWS's own gradual-deployment guide, which uses an alias
    # literally named "live" in its example) — which would defeat
    # "deploy, then promote" the very first time CI ran an ordinary
    # deploy. FunctionVersion here comes from the LiveVersion parameter
    # instead, which scripts/deploy.sh reads back from the alias's own
    # current state before every ordinary deploy (see that parameter's
    # description) so the declared value never actually changes on an
    # ordinary deploy and CloudFormation leaves this resource alone.
    # Promotion is a direct `aws lambda update-alias --name live` call
    # (child D), never a stack update.

  PreprodAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref McpFunction
      Name: preprod
      FunctionVersion: !Ref PreprodVersion
    # Also not AutoPublishAlias, for the same reason LiveAlias isn't —
    # see PreprodVersion's own parameter description for why preprod,
    # unlike live, needs no read-back protection: it is supposed to
    # move on every deploy, and child D does that directly.

  PreprodFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref McpFunction
      Qualifier: preprod
      # NONE, not AWS_IAM: this endpoint carries the same
      # application-level bearer-token auth the production HTTP API
      # does (src/auth.ts's requireBearerToken, checked on every /mcp
      # call regardless of transport) — the plan's own words, "The URL
      # carries the same bearer auth the production endpoint does."
      # Nothing behind this URL is reachable without that token.
      AuthType: NONE
    # Must reference the literal alias name "preprod" here, matching
    # PreprodAlias.Properties.Name above — Qualifier takes the alias
    # *name*, not a !Ref (which would resolve to the alias's ARN, the
    # wrong shape for this property; docs.aws.amazon.com's own
    # AWS::Lambda::Url reference: "Qualifier — The alias name.").

  PreprodFunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      # Scoped to the preprod alias specifically (not the bare
      # function / $LATEST) — the qualified ARN this permission is
      # attached to is exactly what makes preprod's Function URL the
      # only externally reachable path to that alias (I3).
      FunctionName: !Ref PreprodAlias
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Fixed to the API Gateway reserved stage name `$default` — NOT
      # `!Ref Stage`. This is deliberate, not a placeholder: a named
      # stage puts that name in the invoke URL and in every request's
      # `rawPath` (API Gateway HTTP API behavior), which `src/httpApp.ts`
      # never registers, so the deployed endpoint 404s on every path
      # (the defect fixed by this rework, node P2-N008 — see
      # docs/runbook.md's "Why the endpoint has no stage segment" note
      # and test/lambda.test.ts, which regression-tests this exact
      # shape). Do not change this back to `!Ref Stage` or any named
      # stage.
      StageName: "$default"
      Tags:
        Stage: !Ref Stage
      # No custom domain (plan decision 9) — the default execute-api
      # endpoint URL is what the runbook records and what .mcp.json
      # enlists against.

  # node P2-N015 — the production integration, route, and invoke
  # permission are declared explicitly (raw AWS::ApiGatewayV2::* /
  # AWS::Lambda::Permission) rather than through McpFunction's
  # `Events:`, because that is the only way to bind the integration to
  # LiveAlias specifically (I4; docs/findings/alias-assumptions.md,
  # assumption 4 — "Passing !Ref LiveAlias ... as the IntegrationUri's
  # function reference ... binds the integration to that alias
  # specifically"). This is the *only* HTTP API integration this
  # template declares, and it is qualified — I3.
  McpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Ref LiveAlias
      IntegrationMethod: POST
      PayloadFormatVersion: "2.0"

  McpRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "ANY /mcp"
      Target: !Sub "integrations/${McpIntegration}"

  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /health"
      Target: !Sub "integrations/${McpIntegration}"

  LiveInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      # Scoped to LiveAlias, not the bare function — API Gateway can
      # only invoke the `live`-qualified ARN this permission names
      # (I3: the production integration resolves to `live` and
      # nothing else is reachable through it).
      FunctionName: !Ref LiveAlias
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/*"

Outputs:
  Endpoint:
    Description: >
      The base URL to enlist against — production, served by `live`
      (node P2-N015). The MCP endpoint is `<Endpoint>/mcp`; the
      unauthenticated liveness check is `<Endpoint>/health`. No stage
      segment (the HTTP API's stage is fixed to `$default`; see the
      HttpApi resource above). Recorded in docs/runbook.md after the
      first deploy (O2).
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  PreprodEndpoint:
    Description: >
      The `preprod` alias's Function URL (node P2-N015) — what child
      D's smoke test calls, and what a human re-runs the smoke script
      against by hand (docs/runbook.md). No stage segment; the MCP
      endpoint is `<PreprodEndpoint>mcp` (a Function URL's own trailing
      slash — check the actual value before concatenating).
    Value: !GetAtt PreprodFunctionUrl.FunctionUrl
  McpFunctionName:
    Description: The deployed Lambda function's name (for `aws logs tail`, etc.).
    Value: !Ref McpFunction
  LeaseTableName:
    Description: >
      The production (`live`) advisory write-lease table's name (for
      `aws dynamodb get-item`, etc., if a lease ever needs inspecting
      by hand).
    Value: !Ref LeaseTable
  PreprodLeaseTableName:
    Description: >
      The `preprod` advisory write-lease table's name (node P2-N015) —
      what G3's two-tables-one-observation check reads directly to
      confirm a preprod-invoked lease acquire did not land in the
      production table.
    Value: !Ref PreprodLeaseTable
