AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  project-orchestrator-service — chunk 1, node P2-N002 of
  p2-n002-service-skeleton: one Lambda function behind an HTTP API,
  serving MCP over streamable HTTP. `service_identity` (child B, node
  P2-N008), `plan_read` (child C, node P2-N009, GitHub App credentials
  below), and the advisory-lease write path — `plan_lease_acquire` /
  `plan_update` / `plan_confirm` / `plan_lease_release` (child D, node
  P2-N010) — are wired; its DynamoDB lease table (`LeaseTable` below)
  is the one piece of plan-state storage this service holds — never
  register content, only the lease (decision 7; I5). See
  docs/runbook.md for the deploy procedure and
  https://github.com/majodali/project-orchestrator/blob/main/docs/plans/p2-n002-service-skeleton.md
  for why this template is shaped the way it is.

Parameters:
  Stage:
    Type: String
    Default: prod
    Description: >
      A label for this deployment (e.g. `prod`, or a scratch value for
      testing the runbook itself) — NOT the API Gateway stage name.
      The HTTP API's actual stage is fixed to the reserved name
      `$default` (see the HttpApi resource below) so the invoke URL
      carries no stage segment and `rawPath` is `/health` / `/mcp`,
      identical to what `src/httpApp.ts` routes locally. A named stage
      puts that name in `rawPath` (e.g. `/prod/health`), which Hono
      never matches — the defect this rework (node P2-N008) fixes; see
      docs/runbook.md's "Why the endpoint has no stage segment" note.
      `Stage` is still applied as a resource tag below, so deployments
      can be told apart in CloudWatch/Cost Explorer without needing
      distinct API stages.
    AllowedPattern: "^[a-zA-Z0-9]+$"

  AuthTokenSecretName:
    Type: String
    Description: >
      Name (not ARN) of the AWS Secrets Manager secret whose
      SecretString is the bearer token clients present in the
      `Authorization: Bearer <token>` header (decision 5 of the
      p2-n002 plan). The owner creates this secret out of band (O4)
      before deploying — see docs/runbook.md step 4. Resolved into the
      Lambda's environment via a CloudFormation dynamic reference at
      deploy time, so the token is never a literal in this template,
      in a parameter-overrides file, or in git.

  ProjectName:
    Type: String
    Default: majodali/project-orchestrator
    Description: >
      The coordinating repository this deployment answers
      `service_identity` for. Chunk 1 child B does no git reads of its
      own (that starts at child C) — this is metadata only.

  ServiceCommit:
    Type: String
    Default: unknown
    Description: >
      The git commit of project-orchestrator-service this build was
      deployed from. Set by scripts/deploy.sh from `git rev-parse
      HEAD` — see docs/runbook.md. Used only to answer
      `service_identity`; never used for authorization.

  GithubAppId:
    Type: String
    Description: >
      The numeric ID of the GitHub App `plan_read` reads through
      (owner action O3, decision 6 of the p2-n002 plan — an
      installation with `contents: read`, never a personal access
      token). Not secret — visible on the App's own settings page.
      Set by scripts/deploy.sh from the GITHUB_APP_ID environment
      variable; see docs/runbook.md.

  GithubAppInstallationId:
    Type: String
    Description: >
      The App's installation ID for majodali/project-orchestrator
      (owner action O3) — visible in the installation settings URL.
      Not secret. Set by scripts/deploy.sh from
      GITHUB_APP_INSTALLATION_ID; see docs/runbook.md.

  GithubAppPrivateKeySecretName:
    Type: String
    Description: >
      Name (not ARN) of the AWS Secrets Manager secret whose
      SecretString is the GitHub App's PEM private key (owner action
      O3). The owner creates this secret out of band before
      deploying, the same pattern as AuthTokenSecretName above —
      resolved into the Lambda's environment via a CloudFormation
      dynamic reference at deploy time, so the key is never a literal
      in this template, in a parameter-overrides file, or in git.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    MemorySize: 256
    # `service_identity` (chunk 1 child B) answers well inside 10s
    # alone. `plan_read` (chunk 1 child C, node P2-N009) adds up to
    # four sequential GitHub API round trips (mint/reuse an
    # installation token, resolve the default branch when no ref is
    # given, resolve the ref to a commit SHA, fetch file content) —
    # still small individually, but a wider backstop than the
    # reachability slice needed. 20s leaves comfortable headroom
    # below the enlistment file's 30s per-server timeout (G7) while
    # still failing well before a caller's own timeout does. Not yet
    # measured against a real deployment (owner action O3 is
    # outstanding); revisit this value once docs/runbook.md records
    # plan_read's actual cold/warm latency.
    Timeout: 20

Resources:
  McpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      # esbuild bundles the TypeScript entry point directly; no
      # separate `npm run build` step is needed before `sam build`
      # (see docs/runbook.md and scripts/deploy.sh).
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - src/lambda.ts
        Format: esm
        # hono/aws-lambda and @modelcontextprotocol/sdk both ship as
        # ESM; the Lambda Node.js 22 runtime resolves .mjs handlers
        # natively, so no extra loader config is required here.
        OutExtension:
          - .js=.mjs
        # Node P2-N010 rework (post-deploy 500 on every route,
        # including /health): @aws-sdk/client-dynamodb pulls in
        # @smithy/node-http-handler, which is CommonJS and
        # require()s Node builtins (e.g. "node:https"). Under
        # --format=esm there is no `require`, so esbuild's own
        # dynamic-require shim throws at import time and the Lambda
        # function never initializes — API Gateway's own 500, not the
        # app's. This banner defines a real `require` via node:module's
        # createRequire before any bundled code runs, the standard
        # remedy for CJS-dependency interop in an ESM esbuild bundle;
        # ESM output and hono/aws-lambda's `.mjs` handler resolution
        # are unaffected. See package.json's `bundle:lambda` script for
        # the identical banner applied there (kept in sync — both are
        # "the same bundle `sam build` produces", per README.md), and
        # test/lambdaBundle.test.ts for the regression test that
        # imports the built bundle from a real ESM context, the way
        # `node -e` (CommonJS mode) never would have caught this.
        Banner:
          - "js=import { createRequire as __createRequire } from 'node:module'; const require = __createRequire(import.meta.url);"
    Properties:
      Handler: src/lambda.handler
      Description: >
        project-orchestrator-service MCP endpoint (reachability
        slice, node P2-N008).
      Environment:
        Variables:
          MCP_PROJECT: !Ref ProjectName
          SERVICE_COMMIT: !Ref ServiceCommit
          # Resolved by CloudFormation at deploy time from Secrets
          # Manager — never a literal in this template or in any
          # parameter-overrides file committed to git (I7).
          MCP_AUTH_TOKEN: !Sub "{{resolve:secretsmanager:${AuthTokenSecretName}:SecretString}}"
          # plan_read (chunk 1 child C, node P2-N009) — GitHub App
          # credentials, owner action O3. GithubAppId and
          # GithubAppInstallationId are not secret; the private key is
          # resolved the same way MCP_AUTH_TOKEN is above.
          GITHUB_APP_ID: !Ref GithubAppId
          GITHUB_APP_INSTALLATION_ID: !Ref GithubAppInstallationId
          GITHUB_APP_PRIVATE_KEY: !Sub "{{resolve:secretsmanager:${GithubAppPrivateKeySecretName}:SecretString}}"
          # The write path (chunk 1 child D, node P2-N010) — the
          # advisory write lease's only storage. No plan-state content
          # is ever written here; see LeaseTable below.
          LEASE_TABLE_NAME: !Ref LeaseTable
      Policies:
        # Scoped exactly to LeaseTable — no other DynamoDB table this
        # function's role can touch. src/planRegister/dynamoLeaseBackend.ts
        # only ever calls GetItem/PutItem/DeleteItem, all of which this
        # SAM policy template covers.
        - DynamoDBCrudPolicy:
            TableName: !Ref LeaseTable
      Events:
        McpAny:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /mcp
            Method: ANY
        HealthCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
      Tags:
        Stage: !Ref Stage

  LeaseTable:
    Type: AWS::DynamoDB::Table
    Properties:
      # Chunk 1 scope (plan decision 4): plan state for this
      # repository only — a single fixed lease item
      # (src/planRegister/leaseBackend.ts's LEASE_KEY), never one
      # table per project or per node. Contention under multiple live
      # sessions is deferred to chunk 4 (decision 7); this table's
      # shape does not need to anticipate it.
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        # Best-effort cleanup only — AWS documents native TTL deletion
        # as running within (not guaranteed under) about 48 hours of
        # expiry. The authoritative expiry check is application-level,
        # in src/planRegister/dynamoLeaseBackend.ts's acquireLease
        # ConditionExpression (expiresAt < :now), not this attribute.
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Stage
          Value: !Ref Stage

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Fixed to the API Gateway reserved stage name `$default` — NOT
      # `!Ref Stage`. This is deliberate, not a placeholder: a named
      # stage puts that name in the invoke URL and in every request's
      # `rawPath` (API Gateway HTTP API behavior), which `src/httpApp.ts`
      # never registers, so the deployed endpoint 404s on every path
      # (the defect fixed by this rework, node P2-N008 — see
      # docs/runbook.md's "Why the endpoint has no stage segment" note
      # and test/lambda.test.ts, which regression-tests this exact
      # shape). Do not change this back to `!Ref Stage` or any named
      # stage.
      StageName: "$default"
      Tags:
        Stage: !Ref Stage
      # No custom domain (plan decision 9) — the default execute-api
      # endpoint URL is what the runbook records and what .mcp.json
      # enlists against.

Outputs:
  Endpoint:
    Description: >
      The base URL to enlist against. The MCP endpoint is
      `<Endpoint>/mcp`; the unauthenticated liveness check is
      `<Endpoint>/health`. No stage segment (the HTTP API's stage is
      fixed to `$default`; see the HttpApi resource above). Recorded
      in docs/runbook.md after the first deploy (O2).
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  McpFunctionName:
    Description: The deployed Lambda function's name (for `aws logs tail`, etc.).
    Value: !Ref McpFunction
  LeaseTableName:
    Description: >
      The advisory write-lease table's name (for `aws dynamodb
      get-item`, etc., if a lease ever needs inspecting by hand).
    Value: !Ref LeaseTable
